services:
  app:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      HOST: 0.0.0.0
      PORT: 3002
      DATABASE_URL: postgresql://employee_app:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/employee_status
      DATABASE_SSL: "false"
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      UPLOADS_DIR: /data/uploads
    ports:
      - "3002:3002"
    volumes:
      - employee_uploads:/data/uploads

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: employee_status
      POSTGRES_USER: employee_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U employee_app -d employee_status"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - employee_postgres:/var/lib/postgresql/data

volumes:
  employee_postgres:
  employee_uploads:
